<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Tax Invoice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .invoice-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }
        .invoice-header {
            background: #1e293b;
            color: #ffffff;
            padding: 24px;
            text-align: center;
        }
        .invoice-header h2 {
            font-size: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .invoice-header p {
            font-size: 13px;
            color: #94a3b8;
        }
        .invoice-body {
            padding: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .info-label {
            color: #64748b;
        }
        .info-value {
            font-weight: 600;
            color: #0f172a;
        }
        .divider {
            height: 1px;
            background-color: #e2e8f0;
            margin: 16px 0;
        }
        .amount-box {
            background-color: #f8fafc;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #f1f5f9;
        }
        .amount-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .amount-row.total {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px dashed #cbd5e1;
        }
        .status-badge {
            display: inline-block;
            background-color: #dcfce7;
            color: #166534;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 6px;
        }
        .invoice-footer {
            background-color: #f8fafc;
            padding: 16px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

<div class="invoice-card">
    <div class="invoice-header">
        <h2 id="brand-name">STORE NAME</h2>
        <p>OFFICIAL DIGITAL INVOICE</p>
        <span class="status-badge">VERIFIED RECEIPT</span>
    </div>

    <div class="invoice-body">
        <div class="info-row">
            <span class="info-label">Invoice No:</span>
            <span class="info-value" id="inv-no">#0000</span>
        </div>
        <div class="info-row">
            <span class="info-label">Date:</span>
            <span class="info-value" id="inv-date">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">Customer:</span>
            <span class="info-value" id="cust-name">-</span>
        </div>
        <div class="info-row">
            <span class="info-label">Phone:</span>
            <span class="info-value" id="cust-phone">-</span>
        </div>

        <div class="divider"></div>

        <div class="amount-box">
            <div class="amount-row">
                <span>Total Amount:</span>
                <span id="tot-amt">Rs. 0</span>
            </div>
            <div class="amount-row">
                <span>Received:</span>
                <span id="rec-amt">Rs. 0</span>
            </div>
            <div class="amount-row">
                <span>Old Balance:</span>
                <span id="old-bal">Rs. 0</span>
            </div>
            <div class="amount-row total">
                <span>Remaining Balance:</span>
                <span id="rem-bal" style="color: #dc2626;">Rs. 0</span>
            </div>
        </div>
    </div>

    <div class="invoice-footer">
        Thank you for your business! <br>
        For queries, please contact shop support.
    </div>
</div>

<script>
    // URL Se Parameters extract karne ka script
    const urlParams = new URLSearchParams(window.location.search);

    document.getElementById('brand-name').innerText = urlParams.get('store') || "BABU.G COLLECTION";
    document.getElementById('inv-no').innerText = "#" + (urlParams.get('inv') || "N/A");
    document.getElementById('inv-date').innerText = urlParams.get('date') || "N/A";
    document.getElementById('cust-name').innerText = urlParams.get('cust') || "Cash";
    document.getElementById('cust-phone').innerText = urlParams.get('phone') || "N/A";
    document.getElementById('tot-amt').innerText = "Rs. " + (urlParams.get('tot') || "0");
    document.getElementById('rec-amt').innerText = "Rs. " + (urlParams.get('rec') || "0");
    document.getElementById('old-bal').innerText = "Rs. " + (urlParams.get('old') || "0");
    document.getElementById('rem-bal').innerText = "Rs. " + (urlParams.get('bal') || "0");
</script>

</body>
</html>
